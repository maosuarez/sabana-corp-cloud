#cloud-config
# Validated end-to-end 2026-08-08 -- see docs/plans/wireguard-vpn-gateway.md. Installs WireGuard on
# first boot of vm-wg-gateway. Does not create any [Peer] here -- peers (admin, team<N>) are
# added later, incrementally, via yamls/wg-gateway/remote/add-peer.sh.tpl run by
# lab-azure.sh through 'az vm run-command invoke'. The interface name 'eth0' assumed by the
# MASQUERADE below was confirmed against the real Ubuntu image for this VM in that same
# validation (VPN client traffic exits correctly).
#
# dnsmasq (see docs/plans/internal-dns.md): lab's internal DNS, same host as VPN because it's
# the only machine already in the path of all (VPN clients + ACI containers in the VNet).
package_update: true
packages:
  - wireguard
  - wireguard-tools
  - iptables-persistent
  - qrencode
  - dnsmasq
  - dnsutils

write_files:
  - path: /etc/sysctl.d/99-wg-forward.conf
    content: |
      net.ipv4.ip_forward=1

  - path: /etc/wireguard/wg0.conf
    permissions: '0600'
    content: |
      [Interface]
      Address = 10.200.0.1/16
      ListenPort = 51820
      # RELATED,ESTABLISHED rule is mandatory: per-peer rules added by
      # add-peer.sh.tpl only allow "source=<tunnel_ip> -> dest=<cidrs>" (outbound). Response
      # arrives already de-masqueraded by conntrack (source=<real_dest>, dest=<tunnel_ip>)
      # and doesn't match that rule -- without this, every connection drops after the first packet
      # (confirmed in first real run, 2026-08-08: DROP counter increased while the peer admin's
      # ACCEPT counter stalled).
      PostUp   = iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE; iptables -A FORWARD -m state --state RELATED,ESTABLISHED -j ACCEPT; iptables -P FORWARD DROP
      PostDown = iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

  # Lab's internal DNS -- see docs/plans/internal-dns.md "Changes file by file".
  - path: /etc/dnsmasq.d/00-lab.conf
    content: |
      # Listens only on lab interfaces. bind-dynamic (not bind-interfaces): tolerates wg0
      # appearing/disappearing and avoids clashing with systemd-resolved stub at 127.0.0.53:53.
      bind-dynamic
      interface=wg0
      interface=eth0

      # Explicit upstream. no-resolv is MANDATORY: without it, dnsmasq would read /etc/resolv.conf, which
      # on Ubuntu 22.04 points to 127.0.0.53 (systemd-resolved) -> resolution loop with itself.
      no-resolv
      server=168.63.129.16

      # Lab zone is never forwarded upstream: Azure DNS doesn't know it, and without this every
      # non-existent lab name goes to internet and takes time.
      local=/sabanacorp.internal/
      domain=sabanacorp.internal
      expand-hosts
      domain-needed
      bogus-priv

      # Lab records: /etc/hosts format, one file per block, reloaded by inotify (no
      # SIGHUP or service restart needed -- SIGHUP doesn't reread /etc/dnsmasq.d/*.conf, hostsdir does).
      hostsdir=/etc/dnsmasq.hosts.d

      # Short TTL: if a container is recreated with a different IP, correction propagates in seconds.
      local-ttl=10
      cache-size=1000
      log-facility=/var/log/dnsmasq.log
      #log-queries   # enable only for debugging; during event generates a lot of noise

  # Directory must exist before dnsmasq starts -- if hostsdir points to something
  # non-existent, dnsmasq fails to start.
  - path: /etc/dnsmasq.hosts.d/.keep
    content: ""

  # Ubuntu's dnsmasq.service doesn't have Restart=always by default.
  - path: /etc/systemd/system/dnsmasq.service.d/10-restart.conf
    content: |
      [Service]
      Restart=always
      RestartSec=2

runcmd:
  # Server keypair is generated here, not just in init-server-keys.sh: wg-quick requires
  # PrivateKey defined in [Interface] to bring up the interface, so without this
  # 'systemctl enable --now wg-quick@wg0' would fail on first boot (wg0.conf without PrivateKey
  # yet). init-server-keys.sh still exists for the idempotent case of requesting the
  # PUBKEY again later, not for initial generation.
  - umask 077 && wg genkey | tee /etc/wireguard/server_private.key | wg pubkey > /etc/wireguard/server_public.key
  - sed -i "/^\[Interface\]/a PrivateKey = $(cat /etc/wireguard/server_private.key)" /etc/wireguard/wg0.conf
  - sysctl --system
  - systemctl enable --now wg-quick@wg0
  # INPUT rules for 53: document intent, are no-ops while INPUT policy stays
  # at ACCEPT (see docs/plans/internal-dns.md "Resilience" -- security note). Go before the
  # netfilter-persistent save that already exists.
  - iptables -A INPUT -i wg0 -p udp --dport 53 -j ACCEPT
  - iptables -A INPUT -i wg0 -p tcp --dport 53 -j ACCEPT
  - iptables -A INPUT -i eth0 -s 10.0.0.0/8 -p udp --dport 53 -j ACCEPT
  - iptables -A INPUT -i eth0 -s 10.0.0.0/8 -p tcp --dport 53 -j ACCEPT
  - netfilter-persistent save
  - systemctl daemon-reload
  - systemctl enable --now dnsmasq
