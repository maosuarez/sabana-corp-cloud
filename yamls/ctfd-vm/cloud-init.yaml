#cloud-config
# vm-ctfd (snet-dmz-vm) -- same cloud-init as yamls/wiki-vm/cloud-init.yaml (Docker Engine +
# compose plugin via Docker's official script), plus python3-pip: create_ctfd_vm() in
# lab-azure.sh runs scripts/seed_challenges.py (from sabana-corp-CTFd) directly on this VM after
# deploy, against http://localhost -- does not depend on the operator being on VPN. See
# docs/plans/ctfd-deployment.md (F2).
package_update: true
packages:
  - ca-certificates
  - curl
  - python3-pip

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - usermod -aG docker azureuser
