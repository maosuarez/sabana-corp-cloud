#cloud-config
# See docs/plans/observability-monitoring.md (F1). Installs Docker Engine + compose plugin (same
# pattern as yamls/wiki-vm/cloud-init.yaml) plus Azure CLI + jq, which gen-targets.sh needs to
# talk to the control plane via managed identity ('az login --identity').
package_update: true
packages:
  - ca-certificates
  - curl
  - jq

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - usermod -aG docker azureuser
  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
