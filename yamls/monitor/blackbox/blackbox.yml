# blackbox.yml -- modulos usados por gen-targets.sh via el label probe_module (ver inventario de
# sondas en docs/plans/observability-monitoring.md).
modules:
  tcp_connect:
    prober: tcp
    timeout: 5s

  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200, 302]
      preferred_ip_protocol: ip4

  ssh_banner:
    prober: tcp
    timeout: 5s
    tcp:
      query_response:
        - expect: "^SSH-"

  # DnsCaido (ver docs/plans/observability-monitoring.md, tabla de alertas): consulta el propio
  # dnsmasq del gateway (10.10.0.4:53) por un nombre que siempre deberia existir.
  dns_udp:
    prober: dns
    timeout: 5s
    dns:
      query_name: "gw.sabanacorp.internal"
      query_type: "A"
      valid_rcodes: ["NOERROR"]
