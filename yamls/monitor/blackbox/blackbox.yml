# blackbox.yml -- modules used by gen-targets.sh via the probe_module label (see probe
# inventory in docs/plans/observability-monitoring.md).
modules:
  tcp_connect:
    prober: tcp
    timeout: 5s

  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200, 302]
      preferred_ip_protocol: ip4

  ssh_banner:
    prober: tcp
    timeout: 5s
    tcp:
      query_response:
        - expect: "^SSH-"

  # DnsCaido (see docs/plans/observability-monitoring.md, alerts table): queries the gateway's
  # dnsmasq (10.10.0.4:53) for a name that should always exist.
  dns_udp:
    prober: dns
    timeout: 5s
    dns:
      query_name: "gw.sabanacorp.internal"
      query_type: "A"
      valid_rcodes: ["NOERROR"]
