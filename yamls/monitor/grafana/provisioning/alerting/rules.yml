# rules.yml -- Grafana Unified Alerting, provisioned as code (without contact points, see
# "Design decision: visual alert in Grafana, no Alertmanager" in
# docs/plans/observability-monitoring.md). Staff operates with the dashboard on screen; these
# rules only feed the visual alert state and its history (when it started, how long it's been going).
#
# BotColgado is not here: it requires the health endpoint from bot.js (/health, last_visit_ts,
# browser_alive), which is a change in the sabana-corp-network repo, out of scope for this repo
# (see "The blind spot: xss-bot" in the plan).
# GatewaySinHandshakes either: requires reading 'wg show wg0' via run-command against
# vm-wg-gateway, which requires a broader role than the Reader that vm-monitor's managed identity was
# designed with (see "Risks: the managed identity is the most valuable asset in snet-mgmt" -- raising
# that identity's scope just for this alert is not justified without revisiting that decision).
apiVersion: 1

groups:
  - orgId: 1
    name: sabana-corp-servicios
    folder: sabana-corp
    interval: 1m
    rules:
      - uid: sabana-servicio-caido
        title: ServicioCaido
        condition: C
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} down (team {{ $labels.team }})"
          action: "./lab-azure.sh restore team {{ $labels.team }} {{ $labels.service }}  (or restore dmz, if applicable)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: probe_success{group="edificio"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: sabana-edificio-caido
        title: EdificioCaido
        condition: C
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: "All 4 services of team {{ $labels.team }} are down"
          action: "check the subnet/IP pool of snet-team{{ $labels.team }}, not the containers one by one"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum by (team) (probe_success{group="edificio"}) == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: sabana-crash-loop
        title: CrashLoop
        condition: C
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }}: restartCount increased 3+ times in 10 min"
          action: "check logs (az container logs) BEFORE restarting"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(sabana_container_restart_count[10m]) >= 3
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: sabana-deriva-ip
        title: DerivaDeIP
        condition: C
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: "team {{ $labels.team }}/{{ $labels.service }} has an old IP of {{ $labels.depends_on }} baked in"
          action: "./lab-azure.sh restore team {{ $labels.team }} {{ $labels.service }}"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sabana_ip_drift == 1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: sabana-dmz-degradada
        title: DMZDegradada
        condition: C
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} (shared DMZ) down -- affects ALL teams"
          action: "maximum priority: ./lab-azure.sh restore dmz {{ $labels.service }}"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: probe_success{group="dmz"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: sabana-decoy-caido
        title: DecoyCaido
        condition: C
        for: 5m
        labels:
          severity: low
        annotations:
          summary: "{{ $labels.service }} (decoy) down for 5+ min"
          action: "cosmetic, doesn't block any challenge -- restore without urgency"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: probe_success{group="dmz-decoy"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: sabana-dns-caido
        title: DnsCaido
        condition: C
        for: 60s
        labels:
          severity: medium
        annotations:
          summary: "dnsmasq (vm-wg-gateway) not responding at 10.10.0.4:53"
          action: "nobody resolves names, but no challenge goes down -- env vars still use IPs (see docs/plans/internal-dns.md, Resilience)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: probe_success{service="dns"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
