# prometheus.yml -- vm-monitor (snet-mgmt). Ver docs/plans/observability-monitoring.md.
#
# Dos fuentes de señal, unidas por los labels team/service (ver plan, "sondeo externo, no
# agentes"):
#   - blackbox-aci: sonda TCP/HTTP contra la IP:puerto real de cada servicio, targets generados
#     por gen-targets.sh (file_sd, se recarga solo, sin reiniciar Prometheus).
#   - node (textfile collector de node-exporter): estado de control plane (Running/Terminated,
#     restartCount) y sabana_ip_drift, escritos por el mismo gen-targets.sh en la misma pasada.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: blackbox-aci
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/aci_targets.json
        refresh_interval: 1m
    relabel_configs:
      # __address__ en el target file ES la IP:puerto real a sondear -- se mueve a __param_target
      # y se reemplaza por la direccion del blackbox-exporter, que es lo que Prometheus scrapea.
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [probe_module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: blackbox-dns
    metrics_path: /probe
    params:
      module: [dns_udp]
    static_configs:
      - targets:
          - 10.10.0.4:53
        labels:
          group: infra
          team: ""
          service: dns
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
