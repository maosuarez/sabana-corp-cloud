# prometheus.yml -- vm-monitor (snet-mgmt). See docs/plans/observability-monitoring.md.
#
# Two signal sources, joined by team/service labels (see plan, "external probing, no
# agents"):
#   - blackbox-aci: TCP/HTTP probe against the real IP:port of each service, targets generated
#     by gen-targets.sh (file_sd, reloads on its own, without restarting Prometheus).
#   - node (textfile collector from node-exporter): control plane state (Running/Terminated,
#     restartCount) and sabana_ip_drift, written by gen-targets.sh in the same pass.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: blackbox-aci
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/aci_targets.json
        refresh_interval: 1m
    relabel_configs:
      # __address__ in the target file IS the real IP:port to probe -- it moves to __param_target
      # and is replaced by the blackbox-exporter address, which is what Prometheus scrapes.
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [probe_module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: blackbox-dns
    metrics_path: /probe
    params:
      module: [dns_udp]
    static_configs:
      - targets:
          - 10.10.0.4:53
        labels:
          group: infra
          team: ""
          service: dns
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
