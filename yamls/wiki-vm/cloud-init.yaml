#cloud-config
# Validado end-to-end 2026-08-08 -- ver docs/plans/wiki-on-vm.md. Instala Docker Engine + plugin
# compose en la VM al primer arranque, via el script oficial de Docker. La salida a internet desde
# snet-dmz-vm (que este script necesita) quedo confirmada en esa validacion.
package_update: true
packages:
  - ca-certificates
  - curl

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - usermod -aG docker azureuser
