#cloud-config
# Validated end-to-end 2026-08-08 -- see docs/plans/wiki-on-vm.md. Installs Docker Engine + compose
# plugin on VM at first boot, via Docker's official script. Outbound internet from
# snet-dmz-vm (which this script needs) was confirmed in that validation.
package_update: true
packages:
  - ca-certificates
  - curl

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - usermod -aG docker azureuser
