name: Publish nmap-sabana-corp to npm

# Same pattern as ../sabana-corp-CTFd/.github/workflows/deploy.yml: build/test/publish
# triggered by a tag, no manual publishing from a laptop (unrepeatable, no trace). See
# docs/plans/nmap-sabana-corp.md, "Publishing and versioning".
on:
  push:
    tags:
      - "nmap-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/nmap-sabana-corp
    permissions:
      contents: read
      id-token: write # required by --provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install (no runtime dependencies, only validates lockfile)
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify that tag matches package.json
        run: |
          tag_version="${GITHUB_REF_NAME#nmap-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$pkg_version" ]]; then
            echo "[ERROR] tag nmap-v${tag_version} does not match package.json (${pkg_version})" >&2
            exit 1
          fi

      # Secret to inject in Settings > Secrets and variables > Actions: NPM_TOKEN
      # (npm Access Token with publish permission on the nmap-sabana-corp package).
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
